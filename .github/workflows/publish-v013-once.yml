name: Publish v0.1.3 once
on:
  push:
    branches: ['main']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.3
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate release asset
        run: |
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.3 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create v0.1.3 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --title "MediaDeck v0.1.3" --generate-notes
          fi
