name: Tag v0.1.3 once
on:
  push:
    branches: ['main']
permissions:
  contents: write
jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create v0.1.3 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.3" >/dev/null 2>&1; then
            echo "v0.1.3 already exists"
          else
            git tag -a v0.1.3 91e5cb002f827ba55dd0de5e2b516e8c86fbcb37 -m "MediaDeck v0.1.3"
            git push origin refs/tags/v0.1.3
          fi
