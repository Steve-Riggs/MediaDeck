name: Publish v0.1.2 once
on:
  push:
    branches: ['main']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 61bef46dd5a6192c1021b5d8bf91c87de4f5c735
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate release asset
        run: |
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
      - name: Create v0.1.2 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.2" >/dev/null 2>&1; then
            echo "v0.1.2 tag already exists"
          else
            git tag -a v0.1.2 61bef46dd5a6192c1021b5d8bf91c87de4f5c735 -m "MediaDeck v0.1.2"
            git push origin refs/tags/v0.1.2
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Hotfix for the v0.1.1 new-card editor bootstrap regression.

          Fixes:
          - new MediaDeck cards with an empty initial entity remain editable
          - the Primary media entity selector is visible during first-time setup
          - the preview shows a setup prompt instead of throwing a configuration error
          - genuinely malformed nested configuration remains strictly rejected

          Verified with formatting, lint, TypeScript, 56/56 automated tests, production build and release asset registration checks.
          EOF
          )
          if gh release view v0.1.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.2 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create v0.1.2 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --target 61bef46dd5a6192c1021b5d8bf91c87de4f5c735 --title "MediaDeck v0.1.2" --notes "$NOTES"
          fi
