name: Format power helper
on:
  push:
    branches: ['feature/power-entity-gui']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/config/validate.ts src/editor/actions-section.ts src/session/resolve-session.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-power-files
          path: |
            src/config/validate.ts
            src/editor/actions-section.ts
            src/session/resolve-session.ts
