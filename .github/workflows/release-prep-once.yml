name: Release prep once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package version
        run: npm version 0.1.0 --no-git-tag-version
      - name: Set browser banner version
        run: sed -i 's/0\.1\.0-alpha\.1/0.1.0/g' src/index.ts
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/index.ts
          git commit -m "chore: set version 0.1.0"
          git push origin HEAD:main
