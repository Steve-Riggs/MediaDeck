name: Publish reviewed MediaDeck v0.2.0
on:
  push:
    branches: ['feature/publish-v0.2.0']
    paths: ['.github/workflows/publish-v0.2.0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1a7dbba6ab1b1b6a7f70e179562e5b56b3339c20
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 1a7dbba6ab1b1b6a7f70e179562e5b56b3339c20
        run: |
          test "$(node -p "require('./package.json').version")" = "0.2.0"
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
          grep -q "0.2.0" dist/mediadeck.js
          cat > /tmp/mediadeck-release-notes.md <<'NOTES'
          MediaDeck v0.2.0
          
          - Show friendly streaming app names such as Prime Video, Disney+ and Netflix, with editable overrides.
          - Hide Sources from Layout without leaving an empty gap.
          - Simplify Appearance with Compact/Standard/Expanded presets, colour controls and resets.
          - Choose Home Assistant, Fanart.tv or TMDB artwork, with poster/backdrop styles and optional Home Assistant fallback.
          - Cache lookups, handle failures and broken images, and ignore results after provider changes.
          - Exclude music and other unsupported media from film/TV lookup.
          
          Setup: open the card editor's Artwork section. Home Assistant is the default and needs no keys. Fanart.tv requires a project API key; title matching also requires a TMDB API key. Lookup needs an actual programme title or content ID supplied by Home Assistant, rather than only the app name. Keys are stored in dashboard configuration and visible to dashboard users.
          
          Validation: format, lint, TypeScript, 103 tests and production build passed. Live credentialed API and browser visual checks were not available in the development environment.
          NOTES
          gh release create v0.2.0 dist/mediadeck.js --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "MediaDeck v0.2.0" --notes-file /tmp/mediadeck-release-notes.md
