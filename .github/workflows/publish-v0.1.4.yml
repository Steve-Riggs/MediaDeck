name: Publish reviewed MediaDeck v0.1.4
on:
  push:
    branches: ['feature/publish-v0.1.4']
    paths: ['.github/workflows/publish-v0.1.4.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a9d048bf6640fb49fa30169da8c96c3ce2895527
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: a9d048bf6640fb49fa30169da8c96c3ce2895527
        run: |
          test "$(node -p "require('./package.json').version")" = "0.1.4"
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
          grep -q "0.1.4" dist/mediadeck.js
          cat > /tmp/mediadeck-release-notes.md <<'NOTES'
          Includes independent Power entity selection for media players and remotes, plus optional on/off service overrides.

          Fixes:
          - Invalid service entries stay editable and are kept local until corrected, preserving the working preview.
          - Off, unknown and unavailable power state selects the wake/on action. A missing controller can be recovered with an on-service override.
          - Power overrides honour confirmation and preserve service data and targets.

          Verified with 72 automated tests, formatting, lint, TypeScript and production build. Live TV behaviour still depends on the configured Home Assistant integration.
          NOTES
          gh release create v0.1.4 dist/mediadeck.js --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "MediaDeck v0.1.4" --notes-file /tmp/mediadeck-release-notes.md
