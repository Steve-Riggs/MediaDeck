name: Prepare v0.1.3 once
on:
  push:
    branches: ['fix/v0.1.3-natural-sections-height']
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.1.3-natural-sections-height
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: |
          npm version 0.1.3 --no-git-tag-version
          sed -i "s/MediaDeck %c 0\.1\.2/MediaDeck %c 0.1.3/" src/index.ts
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate release asset
        run: |
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
      - name: Commit v0.1.3 preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: prepare v0.1.3 release"
          git push origin HEAD:fix/v0.1.3-natural-sections-height
