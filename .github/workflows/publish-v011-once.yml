name: Publish v0.1.1 once
on:
  push:
    branches: ['main']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cb3ca5644c27e7875a23a6c7a08cc7afa1af45bf
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Validate release asset
        run: |
          test -s dist/mediadeck.js
          grep -q "mediadeck-card" dist/mediadeck.js
          grep -q "mediadeck-editor" dist/mediadeck.js
      - name: Create v0.1.1 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.1" >/dev/null 2>&1; then
            echo "v0.1.1 tag already exists"
          else
            git tag -a v0.1.1 cb3ca5644c27e7875a23a6c7a08cc7afa1af45bf -m "MediaDeck v0.1.1"
            git push origin refs/tags/v0.1.1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Reliability-focused update based on review and reproduced Home Assistant scenarios.

          Highlights:
          - keeps playback/control resolution bound to the selected TV input
          - routes capabilities to the correct TV, transport, AVR/audio and remote targets
          - fixes editor dropdown selection binding and duplicate-friendly-name labelling
          - adds Home Assistant entity-registry-backed platform/device detection plus manual platform override
          - preserves volume slider state while dragging
          - honours full section ordering and density presentation
          - validates nested configuration and surfaces useful editor errors
          - enables custom actions with confirmation handling
          - adds interactive seek/progress with elapsed-time extrapolation
          - improves same-device discovery for Android TV Remote + Cast setups

          Verified with formatting, lint, TypeScript, 53/53 automated tests, production build and release asset registration checks.
          EOF
          )
          if gh release view v0.1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v0.1.1 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create v0.1.1 dist/mediadeck.js --repo "${GITHUB_REPOSITORY}" --target cb3ca5644c27e7875a23a6c7a08cc7afa1af45bf --title "MediaDeck v0.1.1" --notes "$NOTES"
          fi
